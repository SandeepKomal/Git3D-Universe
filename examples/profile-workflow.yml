# Copy into your profile repository as .github/workflows/git3d-universe.yml
name: Git3D Universe

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: git3d-universe
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: SandeepKomal/Git3D-Universe@main
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: aurora
          output: profile/git3d-universe.svg

      - name: Commit visualization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/git3d-universe.svg
          if git diff --cached --quiet; then
            echo "No Git3D changes."
          else
            git commit -m "chore: refresh Git3D Universe"
            git push
          fi
